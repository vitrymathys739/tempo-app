<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tempo - Connexion</title>

    <!-- Balises PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tempo">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: #18181b;
            --text-color: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #27272a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        /* Onglets bascule Connexion / Inscription */
        .auth-tabs {
            display: flex;
            background: var(--bg-color);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Formulaires */
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .submit-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo-area">
            <h1>Tempo</h1>
            <p id="subtitle">Connecte-toi pour gérer tes routines</p>
        </div>

        <!-- Boutons pour basculer -->
        <div class="auth-tabs">
            <button class="tab-btn active" id="login-tab" onclick="switchMode('login')">Connexion</button>
            <button class="tab-btn" id="register-tab" onclick="switchMode('register')">Inscription</button>
        </div>

        <!-- Formulaire unique géré en JS -->
        <form id="auth-form" onsubmit="handleSubmit(event)">
            <div class="form-group hidden" id="name-group">
                <label for="name">Nom complet</label>
                <input type="text" id="name" placeholder="Ex: Jean Dupont">
            </div>

            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" required placeholder="nom@exemple.com">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="submit-btn" id="submit-btn-text">Se connecter</button>
        </form>
    </div>

    <script>
        // Enregistrement du Service Worker PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        let isLoginMode = true;

        function switchMode(mode) {
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const nameGroup = document.getElementById('name-group');
            const submitBtnText = document.getElementById('submit-btn-text');
            const subtitle = document.getElementById('subtitle');

            if (mode === 'login') {
                isLoginMode = true;
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                nameGroup.classList.add('hidden');
                submitBtnText.textContent = "Se connecter";
                subtitle.textContent = "Connecte-toi pour gérer tes routines";
            } else {
                isLoginMode = false;
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                nameGroup.classList.remove('hidden');
                submitBtnText.textContent = "Créer mon compte";
                subtitle.textContent = "Crée un compte pour commencer";
            }
        }

        function handleSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            
            // Simulation d'une authentification réussie (on simulera le passage vers ton tableau de bord de routines plus tard)
            if (isLoginMode) {
                alert(`Bon retour parmi nous, ${email} !`);
            } else {
                alert(`Compte créé avec succès pour ${email} !`);
            }
            
            // Ici, tu pourras rediriger vers l'application principale une fois authentifié
        }
    </script>
</body>
</html>
