<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tempo - Mon App de Routine</title>

    <!-- Balises spécifiques pour iOS (iPhone) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tempo">
    
    <!-- Lien vers le fichier manifest pour l'installation multi-plateforme -->
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        p {
            color: #64748b;
            font-size: 1.1rem;
        }
  </style>
</head>
<body>

    <div class="container">
        <h1>Tempo</h1>
        <p>Application prête pour iOS et Android !</p>
    </div>

    <!-- Script pour enregistrer le Service Worker (nécessaire pour Android / PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((reg) => {
                        console.log('Service Worker enregistré avec succès :', reg.scope);
                    })
                    .catch((err) => {
                        console.log('Échec de l\'enregistrement du Service Worker :', err);
                    });
            });
        }
    </script>
</body>
</html>
