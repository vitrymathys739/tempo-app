<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tempo - Tableau de bord</title>

    <!-- Balises PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tempo">
    <link rel="manifest" href="manifest.json">

    <!-- SDK Officiel Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: #18181b;
            --card-hover: #202024;
            --text-color: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --error: #ef4444;
            --border: #27272a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mode aligné en haut quand on est sur le Dashboard */
        body.dashboard-active {
            align-items: flex-start;
            padding-top: 24px;
        }

        /* --- CONTENEURS AUTH & ONBOARDING --- */
        .card-container {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.85rem;
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .auth-tabs {
            display: flex;
            background: var(--bg-color);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="time"],
        select {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
            color-scheme: dark;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .rgpd-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-top: 4px;
        }

        .rgpd-box input[type="checkbox"] {
            margin-top: 2px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .banner {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 16px;
        }

        .error-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
            color: #fca5a5;
        }

        .info-banner {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success);
            color: #6ee7b7;
        }

        .submit-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-btn {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border);
            margin-top: 12px;
        }

        .secondary-btn:hover {
            border-color: var(--text-muted);
            background: var(--card-hover);
        }

        /* --- VUE 3 : DASHBOARD GLOBAL --- */
        .dashboard-container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px 24px;
            border-radius: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .user-greeting h2 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .user-badge {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.8rem;
            color: var(--accent);
            background: rgba(59, 130, 246, 0.12);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .logout-small-btn {
            background: var(--bg-color);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-small-btn:hover {
            color: var(--text-color);
            border-color: var(--text-muted);
        }

        /* Grille des statistiques */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .stat-sub {
            font-size: 0.8rem;
            color: var(--success);
        }

        /* Section Routines */
        .routines-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-header h3 {
            margin: 0;
            font-size: 1.15rem;
        }

        .add-routine-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .add-routine-bar input[type="time"] {
            width: 115px;
        }

        .add-routine-bar input[type="text"] {
            flex: 1;
            min-width: 180px;
        }

        .add-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            height: 44px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-btn:hover {
            background: var(--accent-hover);
        }

        .routine-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .routine-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .routine-item.completed {
            opacity: 0.6;
        }

        .routine-item.completed .routine-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .routine-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .routine-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--success);
            cursor: pointer;
        }

        .routine-time {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent);
            background: rgba(59, 130, 246, 0.12);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .routine-title {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .delete-btn:hover {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- VUE 1 : Connexion / Inscription -->
    <div class="card-container" id="auth-view">
        <div class="logo-area">
            <h1>Tempo</h1>
            <p id="subtitle">Connecte-toi pour accéder à ton espace</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" id="login-tab" onclick="switchMode('login')">Connexion</button>
            <button class="tab-btn" id="register-tab" onclick="switchMode('register')">Inscription</button>
        </div>

        <div id="auth-banner" class="banner error-banner hidden"></div>

        <form id="auth-form" onsubmit="handleAuthSubmit(event)">
            <div class="form-group hidden" id="name-group">
                <label for="name">Prénom ou Pseudo</label>
                <input type="text" id="name" placeholder="Ex: Alex">
            </div>

            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" required placeholder="nom@exemple.com">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe (6 caractères min.)</label>
                <input type="password" id="password" required minlength="6" placeholder="••••••••">
            </div>

            <div class="rgpd-box hidden" id="rgpd-group">
                <input type="checkbox" id="rgpd-consent">
                <label for="rgpd-consent" style="cursor: pointer;">
                    J'accepte que mes données soient hébergées en Europe (UE) conformément au RGPD pour le fonctionnement de mon compte Tempo.
                </label>
            </div>

            <button type="submit" class="submit-btn" id="auth-submit-btn">Se connecter</button>
        </form>
    </div>

    <!-- VUE 2 : Compléter le profil (Uniquement après création de compte) -->
    <div class="card-container hidden" id="onboarding-view">
        <div class="logo-area">
            <h1>Complétez votre profil</h1>
            <p>Dernière étape avant d'accéder à ton tableau de bord</p>
        </div>

        <div id="onboarding-banner" class="banner error-banner hidden"></div>

        <form id="onboarding-form" onsubmit="handleProfileSubmit(event)">
            <div class="form-group">
                <label for="birth-date">Date de naissance (10 ans minimum)</label>
                <input type="date" id="birth-date" required onchange="checkAgeRequirement()">
            </div>

            <!-- Accord parental si 10-14 ans -->
            <div class="rgpd-box hidden" id="parental-group">
                <input type="checkbox" id="parental-consent">
                <label for="parental-consent" style="cursor: pointer;">
                    Ayant moins de 15 ans, je confirme avoir l'autorisation d'un parent ou tuteur légal pour utiliser Tempo.
                </label>
            </div>

            <div class="form-group">
                <label for="situation-select">Situation actuelle</label>
                <select id="situation-select" required>
                    <option value="">Sélectionne ta situation...</option>
                    <option value="college">Étudiant au collège</option>
                    <option value="lycee">Étudiant au lycée</option>
                    <option value="superieur">Étudiant dans le supérieur (Fac, BTS, École...)</option>
                    <option value="alternance">En alternance / Apprentissage</option>
                    <option value="salarie">Salarié(e)</option>
                    <option value="independant">Indépendant(e) / Entrepreneur</option>
                    <option value="recherche">En recherche d'emploi / Reconversion</option>
                    <option value="autre">Autre situation</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="profile-submit-btn">Accéder à mon espace</button>
        </form>

        <button type="button" class="submit-btn secondary-btn" onclick="logout()">Annuler et se déconnecter</button>
    </div>

    <!-- VUE 3 : PAGE D'ACCUEIL & DASHBOARD GLOBAL -->
    <div class="dashboard-container hidden" id="dashboard-view">
        <!-- Barre supérieure -->
        <header class="topbar">
            <div class="user-greeting">
                <h2 id="dash-welcome">Bonjour !</h2>
                <span class="user-badge" id="dash-badge">Profil Tempo</span>
            </div>
            <button class="logout-small-btn" onclick="logout()">Se déconnecter</button>
        </header>

        <!-- Cartes de statistiques globales -->
        <section class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Routines du jour</span>
                <span class="stat-value" id="stat-total">0</span>
                <span class="stat-sub">Planifiées aujourd'hui</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Progression</span>
                <span class="stat-value" id="stat-percent">0%</span>
                <span class="stat-sub" id="stat-done-text">0 terminée</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Date du jour</span>
                <span class="stat-value" id="stat-date" style="font-size: 1.35rem; margin-top: 4px;">-</span>
                <span class="stat-sub">Rythme actif</span>
            </div>
        </section>

        <!-- Gestionnaire de routines -->
        <section class="routines-panel">
            <div class="panel-header">
                <h3>Mon programme du jour</h3>
            </div>

            <form class="add-routine-bar" onsubmit="addRoutine(event)">
                <input type="time" id="routine-time" value="08:00" required>
                <input type="text" id="routine-title" placeholder="Ajouter une routine (ex: Révisions, Sport, Lecture...)" required>
                <button type="submit" class="add-btn">+ Ajouter</button>
            </form>

            <div class="routine-list" id="routine-list">
                <!-- Les routines s'affichent ici -->
            </div>
        </section>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        // ⚠️ REMPLACE CES DEUX VALEURS PAR CELLES DE TON PROJET SUPABASE ⚠️
        const SUPABASE_URL = 'https://kgrgetlhsedhhjgjxonj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-mMY5b7LTRwzCE5ny1aMSw_8KEvUMCT';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = true;
        let currentUser = null;
        let routines = [];

        const situationLabels = {
            'college': 'Étudiant au collège',
            'lycee': 'Étudiant au lycée',
            'superieur': 'Étudiant dans le supérieur',
            'alternance': 'En alternance / Apprentissage',
            'salarie': 'Salarié(e)',
            'independant': 'Indépendant(e) / Entrepreneur',
            'recherche': 'En recherche d\'emploi',
            'autre': 'Autre situation'
        };

        // Routines suggérées par défaut lors de la première visite selon la situation
        const defaultRoutinesBySituation = {
            'college': [
                { id: 1, time: '07:30', title: 'Préparation du sac et petit-déjeuner', done: true },
                { id: 2, time: '17:30', title: 'Devoirs et révisions des cours du jour', done: false },
                { id: 3, time: '21:30', title: 'Extinction des écrans avant de dormir', done: false }
            ],
            'lycee': [
                { id: 1, time: '07:15', title: 'Routine matinale & organisation', done: true },
                { id: 2, time: '18:00', title: 'Session de travail approfondi (45 min)', done: false },
                { id: 3, time: '22:00', title: 'Préparation de la journée de demain', done: false }
            ],
            'default': [
                { id: 1, time: '08:00', title: 'Planification des 3 priorités du jour', done: true },
                { id: 2, time: '14:00', title: 'Session de concentration (Deep Work)', done: false },
                { id: 3, time: '18:30', title: 'Activité physique ou détente', done: false }
            ]
        };

        function calculateAge(birthDateString) {
            const today = new Date();
            const birthDate = new Date(birthDateString);
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        // Vérification automatique de la session au chargement
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                await routeUserAfterAuth(session.user);
            }
        });

        function switchMode(mode) {
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const nameGroup = document.getElementById('name-group');
            const rgpdGroup = document.getElementById('rgpd-group');
            const rgpdConsent = document.getElementById('rgpd-consent');
            const submitBtn = document.getElementById('auth-submit-btn');
            const subtitle = document.getElementById('subtitle');
            hideBanner('auth-banner');

            if (mode === 'login') {
                isLoginMode = true;
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                nameGroup.classList.add('hidden');
                rgpdGroup.classList.add('hidden');
                rgpdConsent.required = false;
                submitBtn.textContent = "Se connecter";
                subtitle.textContent = "Connecte-toi pour accéder à ton espace";
            } else {
                isLoginMode = false;
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                nameGroup.classList.remove('hidden');
                rgpdGroup.classList.remove('hidden');
                rgpdConsent.required = true;
                submitBtn.textContent = "Continuer";
                subtitle.textContent = "Crée ton compte Tempo en quelques secondes";
            }
        }

        // Étape 1 : Connexion ou Inscription
        async function handleAuthSubmit(event) {
            event.preventDefault();
            hideBanner('auth-banner');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('name').value.trim();
            const submitBtn = document.getElementById('auth-submit-btn');

            submitBtn.disabled = true;
            submitBtn.textContent = "Chargement...";

            try {
                if (isLoginMode) {
                    // CONNEXION -> Va directement vérifier le profil et ouvrir le Dashboard
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    await routeUserAfterAuth(data.user);
                } else {
                    // INSCRIPTION -> Crée le compte et envoie vers la complétion du profil
                    const { data, error } = await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: { data: { full_name: fullName } }
                    });
                    if (error) throw error;

                    if (data.user && data.session) {
                        currentUser = data.user;
                        showOnboardingView();
                    } else {
                        showBanner('auth-banner', "Compte créé ! Vérifie tes emails pour valider ton adresse avant de te connecter.", 'info');
                    }
                }
            } catch (error) {
                showBanner('auth-banner', traductionErreur(error.message), 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isLoginMode ? "Se connecter" : "Continuer";
            }
        }

        // Aiguillage intelligent après connexion
        async function routeUserAfterAuth(user) {
            currentUser = user;
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (profile) {
                // Profil complet -> Directement sur la page d'accueil (Dashboard)
                showDashboardView(user, profile);
            } else {
                // Profil non terminé -> Passage par la page de complétion
                showOnboardingView();
            }
        }

        function showOnboardingView() {
            document.body.classList.remove('dashboard-active');
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('onboarding-view').classList.remove('hidden');
        }

        function checkAgeRequirement() {
            const birthDateVal = document.getElementById('birth-date').value;
            const parentalGroup = document.getElementById('parental-group');
            const parentalConsent = document.getElementById('parental-consent');
            hideBanner('onboarding-banner');

            if (!birthDateVal) return;
            const age = calculateAge(birthDateVal);

            if (age < 10) {
                showBanner('onboarding-banner', "Désolé, l'inscription sur Tempo est réservée aux personnes âgées d'au moins 10 ans.", 'error');
                parentalGroup.classList.add('hidden');
                parentalConsent.required = false;
            } else if (age < 15) {
                parentalGroup.classList.remove('hidden');
                parentalConsent.required = true;
            } else {
                parentalGroup.classList.add('hidden');
                parentalConsent.required = false;
            }
        }

        // Étape 2 : Validation du profil -> Redirection vers le Dashboard
        async function handleProfileSubmit(event) {
            event.preventDefault();
            hideBanner('onboarding-banner');

            const birthDate = document.getElementById('birth-date').value;
            const situation = document.getElementById('situation-select').value;
            const parentalConsent = document.getElementById('parental-consent').checked;
            const submitBtn = document.getElementById('profile-submit-btn');

            const age = calculateAge(birthDate);

            if (age < 10) {
                showBanner('onboarding-banner', "Inscription refusée : tu dois avoir au moins 10 ans pour utiliser Tempo.", 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Création de votre espace...";

            try {
                const fullName = currentUser.user_metadata?.full_name || 'Utilisateur Tempo';
                const newProfile = {
                    id: currentUser.id,
                    full_name: fullName,
                    birth_date: birthDate,
                    situation: situation,
                    parental_consent: age < 15 ? parentalConsent : true
                };

                const { error } = await supabaseClient
                    .from('profiles')
                    .insert([newProfile]);

                if (error) throw error;

                // Une fois le profil enregistré -> Ouverture du Dashboard
                showDashboardView(currentUser, newProfile);
            } catch (err) {
                showBanner('onboarding-banner', "Erreur lors de l'enregistrement : " + err.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Accéder à mon espace";
            }
        }

        // --- LOGIQUE DU DASHBOARD (VUE 3) ---
        function showDashboardView(user, profile) {
            document.body.classList.add('dashboard-active');
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('onboarding-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');

            // Personnalisation de l'en-tête
            const age = calculateAge(profile.birth_date);
            const sitLabel = situationLabels[profile.situation] || profile.situation;
            document.getElementById('dash-welcome').textContent = `Bonjour, ${profile.full_name} 👋`;
            document.getElementById('dash-badge').textContent = `${sitLabel} • ${age} ans`;

            // Date du jour formatée en français
            const optionsDate = { weekday: 'short', day: 'numeric', month: 'short' };
            const todayStr = new Date().toLocaleDateString('fr-FR', optionsDate);
            document.getElementById('stat-date').textContent = todayStr.charAt(0).toUpperCase() + todayStr.slice(1);

            // Chargement des routines de l'utilisateur (sauvegardées par ID utilisateur)
            const storageKey = `tempo_routines_${user.id}`;
            const saved = localStorage.getItem(storageKey);
            if (saved) {
                routines = JSON.parse(saved);
            } else {
                routines = defaultRoutinesBySituation[profile.situation] || defaultRoutinesBySituation['default'];
                saveRoutines();
            }

            renderRoutines();
        }

        function saveRoutines() {
            if (!currentUser) return;
            localStorage.setItem(`tempo_routines_${currentUser.id}`, JSON.stringify(routines));
        }

        function renderRoutines() {
            const listEl = document.getElementById('routine-list');
            listEl.innerHTML = '';

            // Tri chronologique par heure
            routines.sort((a, b) => a.time.localeCompare(b.time));

            routines.forEach(item => {
                const div = document.createElement('div');
                div.className = `routine-item ${item.done ? 'completed' : ''}`;
                div.innerHTML = `
                    <div class="routine-left">
                        <input type="checkbox" class="routine-checkbox" ${item.done ? 'checked' : ''} onchange="toggleRoutine(${item.id})">
                        <span class="routine-time">${item.time}</span>
                        <span class="routine-title">${item.title}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteRoutine(${item.id})" title="Supprimer">✕</button>
                `;
                listEl.appendChild(div);
            });

            updateStats();
        }

        function addRoutine(event) {
            event.preventDefault();
            const timeInput = document.getElementById('routine-time');
            const titleInput = document.getElementById('routine-title');

            if (!titleInput.value.trim()) return;

            routines.push({
                id: Date.now(),
                time: timeInput.value,
                title: titleInput.value.trim(),
                done: false
            });

            titleInput.value = '';
            saveRoutines();
            renderRoutines();
        }

        function toggleRoutine(id) {
            const routine = routines.find(r => r.id === id);
            if (routine) {
                routine.done = !routine.done;
                saveRoutines();
                renderRoutines();
            }
        }

        function deleteRoutine(id) {
            routines = routines.filter(r => r.id !== id);
            saveRoutines();
            renderRoutines();
        }

        function updateStats() {
            const total = routines.length;
            const doneCount = routines.filter(r => r.done).length;
            const percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-percent').textContent = `${percent}%`;
            document.getElementById('stat-done-text').textContent = `${doneCount} terminée${doneCount > 1 ? 's' : ''}`;
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            routines = [];
            document.body.classList.remove('dashboard-active');
            document.getElementById('auth-form').reset();
            document.getElementById('onboarding-form').reset();
            hideBanner('auth-banner');
            hideBanner('onboarding-banner');
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('onboarding-view').classList.add('hidden');
            document.getElementById('auth-view').classList.remove('hidden');
        }

        function showBanner(id, msg, type) {
            const banner = document.getElementById(id);
            banner.textContent = msg;
            banner.className = `banner ${type === 'error' ? 'error-banner' : 'info-banner'}`;
            banner.classList.remove('hidden');
        }

        function hideBanner(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function traductionErreur(message) {
            if (message.includes("Invalid login credentials")) return "Email ou mot de passe incorrect.";
            if (message.includes("User already registered")) return "Un compte existe déjà avec cet email.";
            if (message.includes("Password should be at least")) return "Le mot de passe doit faire au moins 6 caractères.";
            return "Erreur : " + message;
        }
    </script>
</body>
</html>
