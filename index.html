<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tempo - Connexion</title>

    <!-- Balises PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tempo">
    <link rel="manifest" href="manifest.json">

    <!-- SDK Officiel Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: #18181b;
            --text-color: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --error: #ef4444;
            --border: #27272a;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2rem;
            margin: 0 0 8px 0;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .auth-tabs {
            display: flex;
            background: var(--bg-color);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .rgpd-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .rgpd-box input[type="checkbox"] {
            margin-top: 2px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .error-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            text-align: center;
        }

        .submit-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
            width: 100%;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .logout-btn {
            background: var(--bg-color);
            color: var(--text-muted);
            border: 1px solid var(--border);
            margin-top: 24px;
        }

        .logout-btn:hover {
            color: var(--text-color);
            border-color: var(--text-muted);
            background: var(--bg-color);
        }

        .success-view {
            text-align: center;
            padding: 16px 0;
        }

        .success-icon {
            width: 56px;
            height: 56px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 16px auto;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- VUE 1 : Formulaire de Connexion / Inscription -->
    <div class="card-container" id="auth-view">
        <div class="logo-area">
            <h1>Tempo</h1>
            <p id="subtitle">Connecte-toi pour gérer tes routines</p>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" id="login-tab" onclick="switchMode('login')">Connexion</button>
            <button class="tab-btn" id="register-tab" onclick="switchMode('register')">Inscription</button>
        </div>

        <div id="error-message" class="error-banner hidden" style="margin-bottom: 16px;"></div>

        <form id="auth-form" onsubmit="handleSubmit(event)">
            <div class="form-group hidden" id="name-group">
                <label for="name">Nom complet</label>
                <input type="text" id="name" placeholder="Ex: Jean Dupont">
            </div>

            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" required placeholder="nom@exemple.com">
            </div>

            <div class="form-group">
                <label for="password">Mot de passe (6 caractères min.)</label>
                <input type="password" id="password" required minlength="6" placeholder="••••••••">
            </div>

            <!-- Case de consentement RGPD visible uniquement à l'inscription -->
            <div class="rgpd-box hidden" id="rgpd-group">
                <input type="checkbox" id="rgpd-consent">
                <label for="rgpd-consent" style="cursor: pointer;">
                    J'accepte que mes données soient traitées de manière sécurisée en Europe (UE) conformément au RGPD pour le fonctionnement de mon compte Tempo.
                </label>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Se connecter</button>
        </form>
    </div>

    <!-- VUE 2 : Page de confirmation -->
    <div class="card-container success-view hidden" id="success-view">
        <div class="success-icon">✓</div>
        <h1>Connexion Réussie</h1>
        <p id="welcome-user" style="margin-top: 8px;">Bienvenue sur Tempo !</p>
        <p style="font-size: 0.8rem; margin-top: 12px;">Session sécurisée active</p>
        <button class="submit-btn logout-btn" onclick="logout()">Se déconnecter</button>
    </div>

    <script>
        // Enregistrement du Service Worker PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        const SUPABASE_URL = 'https://kgrgetlhsedhhjgjxonj.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-mMY5b7LTRwzCE5ny1aMSw_8KEvUMCT';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = true;

        // Vérifier automatiquement si l'utilisateur est déjà connecté au chargement
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showSuccessView(session.user.email);
            }
        });

        function switchMode(mode) {
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const nameGroup = document.getElementById('name-group');
            const rgpdGroup = document.getElementById('rgpd-group');
            const rgpdConsent = document.getElementById('rgpd-consent');
            const submitBtn = document.getElementById('submit-btn');
            const subtitle = document.getElementById('subtitle');
            hideError();

            if (mode === 'login') {
                isLoginMode = true;
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                nameGroup.classList.add('hidden');
                rgpdGroup.classList.add('hidden');
                rgpdConsent.required = false;
                submitBtn.textContent = "Se connecter";
                subtitle.textContent = "Connecte-toi pour gérer tes routines";
            } else {
                isLoginMode = false;
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                nameGroup.classList.remove('hidden');
                rgpdGroup.classList.remove('hidden');
                rgpdConsent.required = true;
                submitBtn.textContent = "Créer mon compte";
                subtitle.textContent = "Crée un compte pour commencer";
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            hideError();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('name').value.trim();
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.textContent = "Chargement...";

            try {
                if (isLoginMode) {
                    // Connexion via Supabase
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });
                    if (error) throw error;
                    showSuccessView(data.user.email);
                } else {
                    // Inscription via Supabase avec métadonnées minimales
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: { full_name: fullName }
                        }
                    });
                    if (error) throw error;
                    
                    if (data.session) {
                        showSuccessView(data.user.email);
                    } else {
                        showError("Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse.");
                    }
                }
            } catch (error) {
                showError(traductionErreur(error.message));
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isLoginMode ? "Se connecter" : "Créer mon compte";
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            document.getElementById('auth-form').reset();
            document.getElementById('success-view').classList.add('hidden');
            document.getElementById('auth-view').classList.remove('hidden');
        }

        function showSuccessView(email) {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('success-view').classList.remove('hidden');
            document.getElementById('welcome-user').textContent = `Connecté avec : ${email}`;
        }

        function showError(msg) {
            const errDiv = document.getElementById('error-message');
            errDiv.textContent = msg;
            errDiv.classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('error-message').classList.add('hidden');
        }

        function traductionErreur(message) {
            if (message.includes("Invalid login credentials")) return "Email ou mot de passe incorrect.";
            if (message.includes("User already registered")) return "Un compte existe déjà avec cet email.";
            if (message.includes("Password should be at least")) return "Le mot de passe doit faire au moins 6 caractères.";
            return "Une erreur est survenue : " + message;
        }
    </script>
</body>
</html>
